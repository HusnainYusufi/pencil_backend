# Server-side backstop for the pre-commit hook: scans the full git history
# of every push and pull request with gitleaks. Local hooks can be skipped;
# this cannot. Make it a required status check on `main`.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1

      - name: no env, key or backup files tracked
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.env$|\.(pem|key|p12|pfx|jks|bak|backup|old|orig|dump)$|\.sql\.gz$' | grep -Ev '\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked sensitive files:"; echo "$bad"; exit 1; fi
          echo "clean"
